<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>민생연구소 쓸모 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header"><div class="admin-brand"><span class="admin-brand-mark">S</span><span>민생연구소 쓸모 관리자</span></div></header>
  <main class="admin-shell">
    <section class="admin-login login-view">
      <h1>관리자 로그인</h1>
      <p class="admin-subtitle">RESEARCH와 LECTURE 콘텐츠를 관리합니다.</p>
      <form id="login-form" class="admin-form">
        <div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="login-password">비밀번호</label><input id="login-password" type="password" autocomplete="current-password" required></div>
        <button class="primary-button" type="submit">로그인</button>
      </form>
      <p class="form-status" aria-live="polite"></p>
    </section>

    <section class="app-view hidden">
      <div class="admin-toolbar"><div><h1>콘텐츠 관리</h1><p class="admin-subtitle">로그인한 관리자만 작성·수정·삭제할 수 있습니다.</p></div><button class="logout-button" type="button">로그아웃</button></div>
      <nav class="admin-tabs" aria-label="콘텐츠 종류"><button class="tab-button is-active" type="button" data-type="research">RESEARCH</button><button class="tab-button" type="button" data-type="lecture">LECTURE</button></nav>
      <div class="admin-grid">
        <aside class="entry-list"><button class="secondary-button new-button" type="button">새 콘텐츠 작성</button><div class="entry-list-items"></div></aside>
        <section class="editor-panel">
          <h2 class="editor-title">새 RESEARCH 글</h2>
          <form class="editor-form">
            <div class="research-fields" data-type="research">
              <div class="field"><label for="research-title">제목</label><input id="research-title" type="text" required></div>
              <div class="field"><label for="research-category">카테고리</label><select id="research-category"><option>AI와 일자리</option><option>중장년의 새로운 기회</option><option>경기북부·지역정책</option><option>정책 아이디어</option></select></div>
              <div class="field"><label for="research-date">작성일</label><input id="research-date" type="date"></div>
              <div class="field"><label for="research-image">대표 이미지</label><input id="research-image" type="file" accept="image/*"><small class="file-note current-image"></small></div>
              <div class="field"><label for="research-summary">짧은 요약</label><textarea id="research-summary" rows="3" required></textarea></div>
              <div class="field"><label for="research-content">본문</label><textarea id="research-content" required></textarea></div>
            </div>
            <div class="lecture-fields hidden" data-type="lecture">
              <div class="field"><label for="lecture-title">강의명</label><input id="lecture-title" type="text" required></div>
              <div class="field"><label for="lecture-organization">기관명</label><input id="lecture-organization" type="text" required></div>
              <div class="field"><label for="lecture-date">강의 날짜</label><input id="lecture-date" type="date" required></div>
              <div class="field"><label for="lecture-image">강의 사진</label><input id="lecture-image" type="file" accept="image/*"><small class="file-note current-image"></small></div>
              <div class="field"><label for="lecture-description">짧은 설명</label><textarea id="lecture-description" rows="5"></textarea></div>
            </div>
            <div class="editor-actions"><button class="primary-button save-button" type="submit">저장</button><button class="danger-button delete-button hidden" type="button">삭제</button></div>
          </form>
          <p class="form-status" aria-live="polite"></p>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
