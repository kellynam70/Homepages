<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>비밀번호 재설정 | 민생연구소 쓸모</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-editor.css">
  <style>[hidden] { display: none !important; }</style>
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-brand" href="index.html"><span class="brand-mark">S</span><span>민생연구소 쓸모</span></a>
    <section class="login-panel" aria-labelledby="reset-title">
      <h1 id="reset-title">비밀번호 찾기</h1>
      <p class="login-intro" id="reset-intro">가입한 이메일로 비밀번호 재설정 링크를 받으세요.</p>
      <form id="request-reset-form" class="site-editor-form">
        <label for="reset-email">이메일</label>
        <input id="reset-email" type="email" autocomplete="username" required>
        <button class="editor-primary" type="submit">재설정 메일 받기</button>
      </form>
      <form id="new-password-form" class="site-editor-form" hidden>
        <label for="new-password">새 비밀번호</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
        <small>8자 이상으로 입력해 주세요.</small>
        <label for="confirm-password">새 비밀번호 확인</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="editor-primary" type="submit">새 비밀번호 저장</button>
      </form>
      <p class="site-editor-status" role="status" aria-live="polite">연결을 확인하고 있습니다.</p>
      <a class="outline-link" id="reset-back" href="login.html">로그인으로 돌아가기</a>
    </section>
  </main>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
